name: Build, test and release macOS Intel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mac-intel-release
  cancel-in-progress: true
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: node .github/scripts/check.cjs npm ci
      - run: command -v ffmpeg || brew install ffmpeg
      - run: npx playwright install chromium
      - name: Locate Chromium for integration tests
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\n')"
      - run: node .github/scripts/check.cjs npm run build
      - run: node .github/scripts/check.cjs npm run test:all
      - run: node .github/scripts/check.cjs npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch and test the packaged Mac app
        run: node .github/scripts/check.cjs npm run test:packaged
      - name: Prepare downloadable extension and checksums
        run: |
          cp downloads/MooZ-Connect.zip artifacts/MooZ-Connect.zip
          shasum -a 256 artifacts/MooZ-CVN-macOS-Intel.zip artifacts/MooZ-CVN-macOS-Intel.dmg artifacts/MooZ-Connect.zip > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MooZ-CVN-macOS-Intel
          path: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
      - name: Publish only after packaged-app checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mooz_release_tag="v$(node -p 'require("./package.json").version')-${GITHUB_SHA:0:7}"
          gh release create "$mooz_release_tag" artifacts/MooZ-CVN-macOS-Intel.zip artifacts/MooZ-CVN-macOS-Intel.dmg artifacts/MooZ-Connect.zip artifacts/SHA256SUMS.txt --latest --title "MooZ CVN $mooz_release_tag · macOS Intel" --notes-file docs/RELEASE-NOTES.md
