name: Verify Settings and Library UI changes
on:
  push:
    branches: [fix/settings-library-controls-20261107]
permissions:
  contents: read
jobs:
  ui-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Set Chromium path
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\n')"
      - run: npm run build
      - run: npm test
      - run: npm run test:ui-regression
      - run: node tests/relay-settings.browser.cjs
      - run: node tests/projects.browser.cjs
      - run: node tests/workspace.browser.cjs
