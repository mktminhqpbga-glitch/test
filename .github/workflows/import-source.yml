name: Import App-MooZ-Workflow into test
on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone source at reviewed commit
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/mktminhqpbga-glitch/App-MooZ-Workflow.git "$RUNNER_TEMP/mooz-source"
          source_sha="$(git -C "$RUNNER_TEMP/mooz-source" rev-parse HEAD)"
          test "$source_sha" = "c922c8cde98eb42f006b44351829eae01a50e5f4" || { echo "Source changed since review: $source_sha"; exit 1; }
      - name: Copy all source files including media binaries into test
        shell: bash
        run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/release-mac.yml' "$RUNNER_TEMP/mooz-source/" "$GITHUB_WORKSPACE/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import App-MooZ-Workflow source snapshot c922c8c'
            git push origin HEAD:main
          fi
          echo 'All source files imported; original repository unchanged.'
